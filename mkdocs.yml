# User documentation, built from docs/ with MkDocs and the Material theme.
# The Docs workflow publishes it at https://timbarnes.github.io/s1/, with the
# internal (cargo doc) docs under api/.
# Preview locally with `mkdocs serve`.
site_name: S1 Scheme
site_url: https://timbarnes.github.io/s1/
site_description: User reference for the S1 Scheme interpreter
repo_url: https://github.com/timbarnes/s1
repo_name: timbarnes/s1
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Language:
    - Lexical Syntax: lexical-syntax.md
    - Primitive Expressions: primitive-expressions.md
    - Derived Expressions: derived-expressions.md
    - Macros: macros.md
    - Program Structure: program-structure.md
    - Records: records.md
    - Libraries: libraries.md
  - Standard Procedures:
    - Equivalence Predicates: equivalence-predicates.md
    - Numbers: numbers.md
    - Booleans: booleans.md
    - Pairs and Lists: pairs-and-lists.md
    - Symbols: symbols.md
    - Characters: characters.md
    - Strings: strings.md
    - Vectors: vectors.md
    - Bytevectors: bytevectors.md
    - Control Features: control-features.md
    - Exceptions: exceptions.md
    - Environments and Evaluation: environments.md
    - Input and Output: input-and-output.md
    - System Interface: system-interface.md
  - Standards Conformance: conformance.md
  - S1 Extensions: extensions.md
  - Internal docs: https://timbarnes.github.io/s1/api/s1/
